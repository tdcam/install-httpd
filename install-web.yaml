---
- name: Install and configure Apache with SSL
  hosts: all
  become: yes
  tasks:
    - name: Install httpd and mod_ssl
      package:
        name:
          - httpd
          - mod_ssl
        state: present

    - name: Enable and start httpd service
      service:
        name: httpd
        enabled: yes
        state: started

    - name: Open firewalld http service
      firewalld:
        name: http
          state: enabled
          permanent: true
          immediate: true

    - name: Open firewalld https service
      firewalld:
        name: https
          state: enabled
          permanent: true
          immediate: true

